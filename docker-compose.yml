services:
  postgres:
    image: postgres:16-alpine
    container_name: customs_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-customs_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-customs_pass}
      POSTGRES_DB: ${DB_NAME:-customs_db}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U customs_user -d customs_db']
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: dev
    container_name: customs_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${DB_USER:-customs_user}:${DB_PASSWORD:-customs_pass}@postgres:5432/${DB_NAME:-customs_db}
      JWT_SECRET: ${JWT_SECRET:-supersecretjwtkey}
      # Trợ lý AI dùng Ollama chạy trên máy host (miễn phí, không cần API key).
      # Có thể đổi sang Groq/Gemini/OpenAI bằng cách sửa 3 biến dưới.
      AI_BASE_URL: ${AI_BASE_URL:-http://host.docker.internal:11434/v1}
      # Giữ đúng model mà README hướng dẫn tải. Để lệch (7b ở đây, 3b trong
      # README) thì backend đi tìm một model chưa được pull về, và chatbox chỉ
      # báo lỗi vào đúng lúc có người bấm thử - thường là giữa buổi demo.
      AI_MODEL: ${AI_MODEL:-qwen2.5:3b}
      AI_API_KEY: ${AI_API_KEY:-not-needed}
      PORT: 3001
      NODE_ENV: development
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    ports:
      - '3001:3001'
    volumes:
      - ./backend/src:/app/src
      - ./backend/prisma:/app/prisma
      # Lưu ý: KHÔNG mount /app/dist hay /app/node_modules thành anonymous volume.
      # Docker giữ lại các volume đó giữa những lần recreate, nên chúng sẽ che mất
      # thư mục tương ứng trong image mới - sửa code rồi rebuild vẫn chạy bản cũ.
    healthcheck:
      # Dùng node thay cho curl: image node:20-alpine không cài sẵn curl, nên
      # healthcheck cũ luôn thất bại và container bị đánh dấu unhealthy dù backend
      # vẫn phục vụ request bình thường.
      test:
        - CMD
        - node
        - '-e'
        - 'require("http").get("http://127.0.0.1:3001/api",r=>process.exit(r.statusCode<500?0:1)).on("error",()=>process.exit(1))'
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    container_name: customs_frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001
      API_URL: http://customs_backend:3001
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-customs_nextauth_secret_2024}
      NEXTAUTH_URL: http://localhost:3000
    ports:
      - '3000:3000'
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      # Cùng lý do như backend: anonymous volume sẽ giữ lại node_modules và cache
      # .next của lần chạy đầu tiên, khiến image build lại không có tác dụng.

volumes:
  postgres_data:
